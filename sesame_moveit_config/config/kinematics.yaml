# sesame_moveit_config/config/kinematics.yaml
# pick_ik in solo posizione: la gamba ha 2 giunti, l'orientamento del piede non è controllabile.
fr_leg: &leg_ik
  kinematics_solver: pick_ik/PickIkPlugin
  kinematics_solver_timeout: 0.05
  kinematics_solver_attempts: 3
  mode: global                 # ricerca globale: utile perché la superficie raggiungibile è stretta
  stop_optimization_on_valid_solution: true
  position_scale: 1.0
  rotation_scale: 0.0          # ignora l'orientamento
  position_threshold: 0.001    # 1 mm (controllo di fine fase 3)
  orientation_threshold: 0.01
  cost_threshold: 0.001
  minimal_displacement_weight: 0.0
  gd_step_size: 0.0001
rr_leg: *leg_ik
fl_leg: *leg_ik
rl_leg: *leg_ik
